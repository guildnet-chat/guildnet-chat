# Lints, tests and builds every push and pull request.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: licences
        run: node .github/licences.mjs
      - run: npm clean-install --include=dev
      - name: lint
        run: npm run lint -- --max-warnings 0
      - name: test
        run: npm test
      - name: build
        run: npm run build
